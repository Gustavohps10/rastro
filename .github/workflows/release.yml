name: CI/CD Pipeline

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Pula o download do binário desktop pesado no runner Linux de testes
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      # Previne que o Node.js lance erro ao avaliar 'electron' em testes unitários headless
      ELECTRON_OVERRIDE_DIST_PATH: /tmp
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-scope: checks

      - name: Typecheck
        run: yarn typecheck --summarize

      - name: Run Unit Tests
        run: yarn test:unit --summarize

      - name: Run UI Tests
        run: yarn test:ui --summarize

      - name: Build
        run: yarn build --summarize

      - name: Upload Turbo Run Summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbo-summaries-test
          path: .turbo/runs/*.json
          retention-days: 7
          if-no-files-found: ignore

  build-e2e:
    name: Build Desktop for E2E
    runs-on: windows-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-scope: desktop

      - name: Build Desktop App
        run: yarn turbo run build --concurrency=100% --filter=@rastrokit/desktop --filter=@rastrokit/datasource-fake --summarize

      - name: Build Observer Test Fixtures
        run: |
          yarn addon:build fake-watcher-for-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          yarn addon:build datasource-alpha-for-tests

      - name: Upload Desktop Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-build
          path: |
            src/apps/desktop/out
            src/packages/*/dist
            src/apps/sdk/dist
            src/dev-addons/datasource-fake/dist
            src/dev-addons/fake-watcher-for-tests/dist
            src/dev-addons/datasource-alpha-for-tests/dist
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

      - name: Upload Turbo Run Summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbo-summaries-build-e2e
          path: .turbo/runs/*.json
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: End-to-End Tests (Desktop) (${{ matrix.shard }}/6)
    needs: [build-e2e]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Download Desktop Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-e2e-build
          path: src

      - name: Link Test Addon
        run: yarn addon:link datasource-fake

      - name: Run E2E Tests
        run: yarn --cwd src/apps/desktop test:e2e --retries=4 --shard=${{ matrix.shard }}/6

      - name: Upload Playwright Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: .temps/playwright/report/
          include-hidden-files: true
          retention-days: 7
          compression-level: 1

  release:
    name: Release & Version
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # Pula o download do binário desktop pesado no runner Linux de testes
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      # Previne que o Node.js lance erro ao avaliar 'electron' em testes unitários headless
      ELECTRON_OVERRIDE_DIST_PATH: /tmp
    outputs:
      has_desktop: ${{ steps.check_desktop.outputs.has_desktop }}
      desktop_version: ${{ steps.check_desktop.outputs.desktop_version }}
      desktop_tag: ${{ steps.check_desktop.outputs.desktop_tag }}
      is_prerelease: ${{ steps.check_desktop.outputs.is_prerelease }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-scope: checks
          restore-only: 'true'

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.15.0

      - name: Check whether the renamed SDK is published
        id: sdk_registry
        run: |
          status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' \
            'https://registry.npmjs.org/@rastrokit%2fsdk')
          case "$status" in
            200) echo 'first_release=false' >> "$GITHUB_OUTPUT" ;;
            404) echo 'first_release=true' >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::npm returned HTTP $status while checking @rastrokit/sdk"; exit 1 ;;
          esac

      - name: Build the first Rastro SDK release
        if: steps.sdk_registry.outputs.first_release == 'true'
        run: yarn turbo run build --filter=@rastrokit/sdk

      - name: Publish the first Rastro SDK release at 0.15.0
        if: steps.sdk_registry.outputs.first_release == 'true'
        working-directory: src/apps/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/rastro-sdk-bootstrap.npmrc
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" != '0.15.0' ]]; then
            echo "::error::The first @rastrokit/sdk release must be 0.15.0, found $version"
            exit 1
          fi
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo '::error::NPM_TOKEN is required for the first @rastrokit/sdk release'
            exit 1
          fi
          trap 'rm -f -- "$NPM_CONFIG_USERCONFIG"' EXIT
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          npm whoami --registry https://registry.npmjs.org
          npm publish --access public --registry https://registry.npmjs.org

      - name: Changesets Action (Create PR or Publish NPM)
        id: changesets
        uses: changesets/action@v1
        with:
          publish: yarn release
          version: yarn changeset version
          title: 'chore: release packages'
          commit: 'chore: version packages'
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if Desktop Release Needed & Push Desktop Tag
        id: check_desktop
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          DESKTOP_VERSION=$(node -p "require('./src/apps/desktop/package.json').version")
          DESKTOP_TAG="@rastrokit/desktop@$DESKTOP_VERSION"

          if [[ "$DESKTOP_VERSION" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

          # Check if assets (.exe / .zip) already exist in the release for this tag
          HAS_ASSETS=$(gh release view "$DESKTOP_TAG" --json assets -q '.assets | length' 2>/dev/null || echo "0")

          if [ "$HAS_ASSETS" = "0" ] && [ "$DESKTOP_VERSION" != "0.0.0" ]; then
            echo "has_desktop=true" >> $GITHUB_OUTPUT
            echo "desktop_version=$DESKTOP_VERSION" >> $GITHUB_OUTPUT
            echo "desktop_tag=$DESKTOP_TAG" >> $GITHUB_OUTPUT
            echo "Desktop version $DESKTOP_VERSION has no release assets, building release"
            
            # Push ONLY this specific desktop tag to origin
            git tag -f "$DESKTOP_TAG"
            git push origin "$DESKTOP_TAG" || true
          else
            echo "has_desktop=false" >> $GITHUB_OUTPUT
            echo "Desktop version $DESKTOP_VERSION already has $HAS_ASSETS release assets"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop:
    name: Build & Upload Desktop Assets
    needs: release
    if: needs.release.outputs.has_desktop == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-scope: desktop
          restore-only: 'true'
          cache-builder: 'true'

      - name: Build Desktop App
        run: yarn turbo run build --concurrency=100% --filter=@rastrokit/desktop --summarize

      - name: Package with Electron Builder
        run: |
          yarn --cwd src/apps/desktop electron-builder --win --publish never
          if (Test-Path "src/apps/desktop/.output/latest.yml") {
            Copy-Item "src/apps/desktop/.output/latest.yml" "src/apps/desktop/.output/beta.yml" -Force
          }
          if (Test-Path "src/apps/desktop/.output/beta.yml") {
            Copy-Item "src/apps/desktop/.output/beta.yml" "src/apps/desktop/.output/latest.yml" -Force
          }
        shell: pwsh
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-package-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Release Notes
        id: extract_notes
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const changelog = fs.readFileSync('src/apps/desktop/CHANGELOG.md', 'utf8');
            const version = '${{ needs.release.outputs.desktop_version }}';
            const escaped = version.replace(/\./g, '\\\\.');
            const regex = new RegExp('## ' + escaped + '[\\\\r\\\\n]+([\\\\s\\\\S]*?)(?=[\\\\r\\\\n]+## |$)');
            const match = changelog.match(regex);
            const notes = match ? match[1].trim() : 'Release ' + version;
            fs.writeFileSync('RELEASE_NOTES.md', notes);
          "

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.desktop_tag }}
          name: ${{ needs.release.outputs.desktop_tag }}
          body_path: RELEASE_NOTES.md
          files: |
            src/apps/desktop/.output/*.exe
            src/apps/desktop/.output/*.zip
            src/apps/desktop/.output/*.blockmap
            src/apps/desktop/.output/*.yml
          generate_release_notes: false
          draft: false
          prerelease: ${{ needs.release.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Turbo Run Summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbo-summaries-build-desktop
          path: .turbo/runs/*.json
          retention-days: 7
          if-no-files-found: ignore
