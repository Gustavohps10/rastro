appId: com.electron.app
productName: Rastro
electronLanguages:
  - en-US
  - pt-BR
directories:
  buildResources: resources
  output: .output
files:
  - out/**/*
  - '!out/**/*.map'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!**/node_modules/{electron,@next,next,@playwright,playwright,playwright-core,vite,tsx,@esbuild,esbuild,@rollup,rollup,typescript,@babel,@img,sharp,tailwindcss,@tailwindcss,lightningcss*,@eslint*,eslint*,prettier*,vitest*,@vitest*,jsdom,msw,husky,@changesets*,turbo*,@types,sqlite3,lokijs,fake-indexeddb}/**'
  - '!**/node_modules/{react-icons,lucide-react,firebase,@firebase,date-fns,date-fns-jalali,@atlaskit,rxdb,react-day-picker,@rastrokit/ui,react,react-dom,react-router,react-router-dom,framer-motion,recharts,babel-plugin-react-compiler,motion-dom,@xyflow,nuqs,tailwind-merge,@tanstack}/**'
  - '!**/node_modules/better-sqlite3/deps/**'
  - '!**/node_modules/**/*.map'
  - '!**/node_modules/*/*.d.ts'
  - '!**/node_modules/*/*/*.d.ts'
  - '!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme,LICENSE,LICENSE.md,license}'
  - '!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}'
extraResources:
  - from: resources
    to: .
    filter:
      - favicon.ico
      - icon.png
      - tray-*.png
  - from: native-prebuilds/window_overlay.node
    to: native-prebuilds/window_overlay.node
  - from: native-prebuilds/updater.exe
    to: native-prebuilds/updater.exe
  - from: native-prebuilds/better_sqlite3_electron.node
    to: native-prebuilds/better_sqlite3_electron.node
asarUnpack:
  - resources/**
  - node_modules/@duckdb/node-bindings*/**
protocols:
  name: Rastro
  schemes:
    - rastro
win:
  icon: resources/favicon.ico
  executableName: rastro
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: rastro-${version}-portable.${ext}
nsis:
  include: resources/installer.nsh
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  perMachine: false
  installerIcon: resources/favicon.ico
  uninstallerIcon: resources/favicon.ico
  installerSidebar: resources/install-sidebar.bmp
  uninstallerSidebar: resources/install-sidebar.bmp
  artifactName: rastro-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
mac:
  icon: resources/icon.png
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  icon: resources/icon.png
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: Gustavohps10
  repo: rastro
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
